<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日幣轉台幣 匯率計算器 - 卡在國際通</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/sketch.css">
    
    <!-- html2canvas for screenshot -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
        .calc-container {
            max-width: 800px;
            margin: var(--spacing-xl) auto;
            padding: 0 var(--spacing-md);
        }
        
        .calc-card {
            background-color: var(--bg-secondary);
            border: var(--border-width-stroke) solid var(--border-strong);
            border-radius: var(--radius-sketch);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sketch-md);
        }
        
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .input-item {
            flex: 1;
            min-width: 200px;
        }
        
        .input-item label {
            display: block;
            margin-bottom: var(--spacing-1);
            font-family: var(--font-display);
            font-weight: bold;
        }
        
        .input-item input {
            width: 100%;
            padding: var(--spacing-2);
            border: 2px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-family: var(--font-handwritten);
            font-size: var(--font-size-lg);
        }
        
        .btn-calc {
            width: 100%;
            margin-top: var(--spacing-md);
        }
        
        .results-section {
            margin-top: var(--spacing-xl);
            display: none;
        }
        
        .process-box {
            background: white;
            border: 1px dashed var(--border-strong);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            font-family: var(--font-mono);
            font-size: var(--font-size-sm);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .average-display {
            text-align: center;
            padding: var(--spacing-lg);
            border: 3px double var(--border-strong);
            border-radius: var(--radius-sketch);
            background-color: #fff9e6;
            margin-bottom: var(--spacing-xl);
        }
        
        .average-value {
            font-size: var(--font-size-4xl);
            color: var(--ink-accent);
            font-weight: bold;
            display: block;
            margin: var(--spacing-2) 0;
        }
        
        .quick-calc {
            background-color: var(--bg-light);
            padding: var(--spacing-md);
            border: 2px solid var(--border-strong);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .quick-calc h3 {
            margin-bottom: var(--spacing-md);
            text-align: center;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--spacing-md);
        }
        
        .history-table th, .history-table td {
            padding: var(--spacing-2);
            border-bottom: 1px solid var(--border-light);
            text-align: left;
        }

        .split-result {
            font-size: var(--font-size-2xl);
            color: var(--ink-blue);
            font-weight: bold;
            text-align: center;
            display: block;
            margin-top: var(--spacing-2);
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main class="calc-container">
        <section class="calc-card">
            <h1 class="text-center mb-md">🧮 日幣轉台幣 匯率計算器</h1>
            <p class="text-gray mb-lg text-center">輸入旅遊日期區間，自動抓取每日歷史匯率並計算平均值，方便分攤帳款！</p>
            
            <div class="input-group">
                <div class="input-item">
                    <label for="startDate">📅 開始日期</label>
                    <input type="date" id="startDate">
                </div>
                <div class="input-item">
                    <label for="endDate">📅 結束日期</label>
                    <input type="date" id="endDate">
                </div>
            </div>
            
            <button id="btnFetch" class="btn-sketch btn-calc">🔍 抓取匯率並計算</button>
        </section>

        <section id="resultsSection" class="results-section">
            <!-- 截圖按鈕 -->
            <div style="text-align: right; margin-bottom: 12px;">
                <button id="btnScreenshot" class="btn-sketch" style="padding: 8px 16px; font-size: 0.9em;">
                    📸 截圖儲存
                </button>
            </div>
            
            <!-- 截圖區域（包含匯率計算 + 試算結果） -->
            <div id="screenshotArea" style="background: linear-gradient(135deg, #fff9e6 0%, #ffffff 100%); padding: 24px; border-radius: 16px; border: 3px solid #f0c040; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
                
                <!-- 標題區 -->
                <div style="text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px dashed #e0c060;">
                    <h2 style="font-size: 1.5em; color: #333; margin: 0;">🏝️ 卡在國際通</h2>
                    <p style="color: #666; font-size: 0.9em; margin-top: 4px;">沖繩旅遊匯率計算結果</p>
                </div>
                
                <!-- 查詢區間 -->
                <div id="dateRangeDisplay" style="text-align: center; background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 0.95em;"></div>
                
                <!-- 每日匯率列表 -->
                <div id="dailyRatesList" style="background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 16px; font-family: var(--font-mono); font-size: 0.9em; line-height: 2;"></div>
                
                <!-- 計算公式 -->
                <div id="calcFormula" style="background: #f5f5f5; border: 2px solid #e0e0e0; border-radius: 10px; padding: 16px; margin-bottom: 16px; font-family: var(--font-mono); font-size: 0.9em;"></div>
                
                <!-- 平均匯率結果（大字顯示） -->
                <div style="background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 16px;">
                    <p style="margin: 0; font-size: 1em; opacity: 0.9;">✅ 平均匯率</p>
                    <p style="margin: 8px 0; font-size: 2.5em; font-weight: bold;">
                        1 JPY = <span id="rateText">---</span> TWD
                    </p>
                    <p id="averageRateDisplay" style="display: none;">---</p>
                </div>
                
                <!-- 快速試算結果區（截圖用） -->
                <div id="quickCalcResult" style="display: none; background: #e3f2fd; padding: 16px; border-radius: 10px; margin-bottom: 16px; border: 2px solid #2196F3;">
                    <h4 style="margin: 0 0 12px 0; color: #1976D2; font-size: 1em;">⚡ 快速試算結果</h4>
                    <div style="display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 1.3em;">
                        <span>💴 <strong id="screenshotJPY">0</strong> 日幣</span>
                        <span style="font-size: 1.5em;">➔</span>
                        <span>💰 <strong id="screenshotTWD" style="color: #d32f2f;">0</strong> 台幣</span>
                    </div>
                </div>
                
                <!-- 好友分帳結果區（截圖用） -->
                <div id="splitCalcResult" style="display: none; background: #fff3e0; padding: 16px; border-radius: 10px; border: 2px solid #FF9800;">
                    <h4 style="margin: 0 0 12px 0; color: #E65100; font-size: 1em;">👥 好友分帳結果</h4>
                    <div style="text-align: center;">
                        <p style="margin: 0; font-size: 0.95em; color: #666;">
                            總金額 💴 <strong id="screenshotSplitJPY">0</strong> 日幣 ÷ <strong id="screenshotPeople">1</strong> 人
                        </p>
                        <p style="margin: 8px 0 0 0; font-size: 1.5em; color: #E65100; font-weight: bold;">
                            每人 💰 <span id="screenshotSplitTWD">NT$ 0</span>
                        </p>
                    </div>
                </div>
                
                <!-- 截圖時間戳 -->
                <p id="screenshotTimestamp" style="text-align: center; font-size: 0.75em; color: #999; margin-top: 16px; margin-bottom: 0;"></p>
            </div>

            <!-- 快速試算（用戶互動區） -->
            <div class="quick-calc">
                <h3>⚡ 快速試算 (日幣 ➔ 台幣)</h3>
                <div class="input-group">
                    <div class="input-item">
                        <label>💴 日幣 (JPY)</label>
                        <input type="number" id="inputJPY" placeholder="輸入日幣金額">
                    </div>
                    <div class="input-item">
                        <label>💰 台幣 (TWD)</label>
                        <input type="number" id="inputTWD" placeholder="換算台幣金額" readonly style="background: #f0f8ff;">
                    </div>
                </div>
            </div>

            <!-- 好友分帳（用戶互動區） -->
            <div class="quick-calc">
                <h3>👥 好友分帳 (日幣 ➔ 台幣)</h3>
                <div class="input-group">
                    <div class="input-item">
                        <label>💴 總金額 (JPY)</label>
                        <input type="number" id="splitJPY" placeholder="例如：5000">
                    </div>
                    <div class="input-item">
                        <label>👤 分攤人數</label>
                        <input type="number" id="peopleCount" value="1" min="1">
                    </div>
                </div>
                <div class="text-center">
                    <span>每人應付</span>
                    <span id="splitResult" class="split-result">NT$ 0</span>
                </div>
            </div>

            <div class="sketch-card">
                <h3>📝 計算過程</h3>
                <div id="calcProcess" class="process-box"></div>
                
                <h3>📅 每日匯率明細</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>1 JPY = ? TWD</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <!-- JS -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/currency-calc.js"></script>
</body>
</html>
