<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日幣轉台幣 匯率計算器 - 卡在國際通</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/sketch.css">
    
    <style>
        .calc-container {
            max-width: 800px;
            margin: var(--spacing-xl) auto;
            padding: 0 var(--spacing-md);
        }
        
        .calc-card {
            background-color: var(--bg-secondary);
            border: var(--border-width-stroke) solid var(--border-strong);
            border-radius: var(--radius-sketch);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sketch-md);
        }
        
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .input-item {
            flex: 1;
            min-width: 200px;
        }
        
        .input-item label {
            display: block;
            margin-bottom: var(--spacing-1);
            font-family: var(--font-display);
            font-weight: bold;
        }
        
        .input-item input {
            width: 100%;
            padding: var(--spacing-2);
            border: 2px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-family: var(--font-handwritten);
            font-size: var(--font-size-lg);
        }
        
        .btn-calc {
            width: 100%;
            margin-top: var(--spacing-md);
        }
        
        .results-section {
            margin-top: var(--spacing-xl);
            display: none;
        }
        
        .process-box {
            background: white;
            border: 1px dashed var(--border-strong);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            font-family: var(--font-mono);
            font-size: var(--font-size-sm);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .average-display {
            text-align: center;
            padding: var(--spacing-lg);
            border: 3px double var(--border-strong);
            border-radius: var(--radius-sketch);
            background-color: #fff9e6;
            margin-bottom: var(--spacing-xl);
        }
        
        .average-value {
            font-size: var(--font-size-4xl);
            color: var(--ink-accent);
            font-weight: bold;
            display: block;
            margin: var(--spacing-2) 0;
        }
        
        .quick-calc {
            background-color: var(--bg-light);
            padding: var(--spacing-md);
            border: 2px solid var(--border-strong);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .quick-calc h3 {
            margin-bottom: var(--spacing-md);
            text-align: center;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--spacing-md);
        }
        
        .history-table th, .history-table td {
            padding: var(--spacing-2);
            border-bottom: 1px solid var(--border-light);
            text-align: left;
        }

        .split-result {
            font-size: var(--font-size-2xl);
            color: var(--ink-blue);
            font-weight: bold;
            text-align: center;
            display: block;
            margin-top: var(--spacing-2);
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main class="calc-container">
        <section class="calc-card">
            <h1 class="text-center mb-md">🧮 日幣轉台幣 匯率計算器</h1>
            <p class="text-gray mb-lg text-center">輸入旅遊日期區間，自動抓取每日歷史匯率並計算平均值，方便分攤帳款！</p>
            
            <div class="input-group">
                <div class="input-item">
                    <label for="startDate">📅 開始日期</label>
                    <input type="date" id="startDate">
                </div>
                <div class="input-item">
                    <label for="endDate">📅 結束日期</label>
                    <input type="date" id="endDate">
                </div>
            </div>
            
            <button id="btnFetch" class="btn-sketch btn-calc">🔍 抓取匯率並計算</button>
        </section>

        <section id="resultsSection" class="results-section">
            <div class="average-display">
                <h3>💱 平均匯率計算</h3>
                
                <!-- 每日匯率列表 -->
                <div id="dailyRatesList" style="text-align: left; margin: 16px auto; max-width: 400px; font-family: var(--font-mono); font-size: 0.95em; line-height: 1.8;"></div>
                
                <!-- 計算公式 -->
                <div id="calcFormula" style="background: #f9f9f9; border: 1px dashed #ccc; border-radius: 8px; padding: 12px; margin: 16px auto; max-width: 500px; font-family: var(--font-mono); font-size: 0.9em; text-align: left;"></div>
                
                <!-- 最終結果 -->
                <div style="margin-top: 16px; padding-top: 16px; border-top: 2px solid #e0e0e0;">
                    <span style="font-size: 1.1em;">✅ 平均匯率結果</span>
                    <span id="averageRateDisplay" class="average-value">---</span>
                    <p class="text-gray" style="font-size: 1.2em; margin-top: 8px; font-weight: bold;">1 日幣 (JPY) = <strong id="rateText" style="color: var(--ink-accent);">---</strong> 台幣 (TWD)</p>
                </div>
            </div>

            <!-- 快速試算 -->
            <div class="quick-calc">
                <h3>⚡ 快速試算 (日幣 ➔ 台幣)</h3>
                <div class="input-group">
                    <div class="input-item">
                        <label>💴 日幣 (JPY)</label>
                        <input type="number" id="inputJPY" placeholder="輸入日幣金額">
                    </div>
                    <div class="input-item">
                        <label>💰 台幣 (TWD)</label>
                        <input type="number" id="inputTWD" placeholder="換算台幣金額" readonly style="background: #f0f8ff;">
                    </div>
                </div>
            </div>

            <!-- 好友分帳 -->
            <div class="quick-calc">
                <h3>👥 好友分帳 (日幣 ➔ 台幣)</h3>
                <div class="input-group">
                    <div class="input-item">
                        <label>💴 總金額 (JPY)</label>
                        <input type="number" id="splitJPY" placeholder="例如：5000">
                    </div>
                    <div class="input-item">
                        <label>👤 分攤人數</label>
                        <input type="number" id="peopleCount" value="1" min="1">
                    </div>
                </div>
                <div class="text-center">
                    <span>每人應付</span>
                    <span id="splitResult" class="split-result">NT$ 0</span>
                </div>
            </div>

            <div class="sketch-card">
                <h3>📝 計算過程</h3>
                <div id="calcProcess" class="process-box"></div>
                
                <h3>📅 每日匯率明細</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>1 JPY = ? TWD</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <!-- JS -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/currency-calc.js"></script>
</body>
</html>
